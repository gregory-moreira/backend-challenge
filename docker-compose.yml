
services:
  postgres:
    image: postgres:17
    container_name: distributed-wallet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: distributed_wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d distributed_wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

